k<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Echo Portfolio</title>

<style>
body {
  margin: 0;
  font-family: system-ui, Arial, sans-serif;
  color: #e6f0ff;
  background: radial-gradient(circle at 20% 20%, #061a2e, #000000 70%);
  overflow-x: hidden;
}

/* glowing “bioluminescent” blobs */
.glow {
  position: fixed;
  width: 300px;
  height: 300px;
  background: rgba(0, 170, 255, 0.15);
  filter: blur(80px);
  border-radius: 50%;
  animation: float 10s infinite ease-in-out;
}

.glow.one { top: 10%; left: 10%; }
.glow.two { bottom: 10%; right: 15%; animation-delay: -3s; }
.glow.three { top: 50%; left: 60%; animation-delay: -6s; }

@keyframes float {
  0%,100% { transform: translateY(0px) translateX(0px); }
  50% { transform: translateY(-40px) translateX(20px); }
}

.container {
  max-width: 800px;
  margin: 80px auto;
  padding: 0 20px;
  position: relative;
}

h1 {
  font-size: 42px;
  margin-bottom: 10px;
  text-shadow: 0 0 10px rgba(0,180,255,0.5);
}

.subtitle {
  color: #9bbcff;
  margin-bottom: 40px;
}

.card {
  background: rgba(10, 20, 40, 0.6);
  border: 1px solid rgba(0, 150, 255, 0.2);
  border-radius: 14px;
  padding: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 25px rgba(0, 140, 255, 0.1);
}

.card h2 {
  margin-top: 0;
  color: #bfe3ff;
}

a {
  color: #4db8ff;
  text-decoration: none;
}

a:hover {
  text-shadow: 0 0 8px rgba(0,180,255,0.8);
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>
<div class="glow three"></div>

<div class="container">

  <h1>Echo Portfolio</h1>
  <div class="subtitle">Signal processing • audio analysis • C systems programming</div>

  <div class="card">
    <h2>Echolocation Project</h2>
    <p>
      A C-based WAV audio cleaner inspired by signal filtering and frequency analysis.
    </p>
    <p>
      <a href="https://github.com/YOURUSERNAME/echolocation" target="_blank">
        View Repository →
      </a>
    </p>
  </div>

</div>

</body>
</html>
