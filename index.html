<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Portfolio</title>

<style>
body {
  margin: 0;
  font-family: system-ui, Arial, sans-serif;
  color: #d9ecff;
  background: #00060f;
  overflow-x: hidden;
}

/* === BIOLUMINESCENT GRID BACKGROUND === */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,180,255,0.15), transparent 40%),
    radial-gradient(circle at 70% 60%, rgba(0,120,255,0.12), transparent 45%),
    linear-gradient(rgba(0, 160, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 160, 255, 0.05) 1px, transparent 1px);
  background-size: auto, auto, 60px 60px, 60px 60px;
  animation: drift 12s infinite linear;
}

@keyframes drift {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

/* soft wave glow layer */
.wave {
  position: fixed;
  width: 200%;
  height: 200px;
  top: 40%;
  left: -50%;
  background: radial-gradient(circle, rgba(0,200,255,0.2), transparent 60%);
  filter: blur(40px);
  animation: waveMove 8s infinite ease-in-out;
}

@keyframes waveMove {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-60px); }
}

.container {
  max-width: 850px;
  margin: 90px auto;
  padding: 0 20px;
  position: relative;
}

h1 {
  font-size: 44px;
  margin-bottom: 8px;
  color: #eaf6ff;
  text-shadow: 0 0 12px rgba(0,180,255,0.4);
}

.subtitle {
  color: #8fbfff;
  margin-bottom: 40px;
}

.card {
  background: rgba(5, 15, 30, 0.65);
  border: 1px solid rgba(0, 170, 255, 0.25);
  border-radius: 14px;
  padding: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 25px rgba(0, 140, 255, 0.12);
}

.card h2 {
  margin-top: 0;
  color: #bfe6ff;
}

a {
  color: #3dbbff;
  text-decoration: none;
}

a:hover {
  text-shadow: 0 0 10px rgba(0,180,255,0.8);
}
</style>
</head>

<body>

<div class="wave"></div>

<div class="container">

  <h1>My Portfolio</h1>
  <div class="subtitle">
    Signal processing • audio systems • C programming
  </div>

  <div class="card">
    <h2>Echolocation Project</h2>
    <p>
      A WAV audio cleaner written in C inspired by frequency filtering and signal analysis.
    </p>

    <p>
      <a href="https://github.com/mariana-nikolyan/echolocation" target="_blank">
        View GitHub Repository →
      </a>
    </p>
  </div>

</div>

</body>
</html>
